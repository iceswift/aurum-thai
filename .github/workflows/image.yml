name: Container image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/iceswift/aurum-thai:sha-${GITHUB_SHA} .
      - name: Check Python imports
        run: docker run --rm ghcr.io/iceswift/aurum-thai:sha-${GITHUB_SHA} python -c 'import main, scrape_once, psycopg'
      - name: Publish main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/iceswift/aurum-thai:sha-${GITHUB_SHA}"
          docker image inspect --format '{{index .RepoDigests 0}}' "ghcr.io/iceswift/aurum-thai:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
