apiVersion: v1
kind: Service
metadata:
  name: aurum-api
  namespace: aurum-production
spec:
  selector:
    app: aurum-api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurum-api
  namespace: aurum-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aurum-api
  template:
    metadata:
      labels:
        app: aurum-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/iceswift/aurum-thai:sha-4cf38fcac2404ff979161fba65b4331d6f161908
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          env:
            - name: RUN_EMBEDDED_SCRAPER
              value: "false"
            - name: CORS_ALLOWED_ORIGINS
              value: https://thaigoldview.com,https://www.thaigoldview.com
            - name: SNAPSHOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aurum-snapshot-db
                  key: url
            - name: FIREBASE_CREDENTIALS_PATH
              value: /run/secrets/aurum/firebase.json
          volumeMounts:
            - name: firebase
              mountPath: /run/secrets/aurum
              readOnly: true
      volumes:
        - name: firebase
          secret:
            secretName: aurum-firebase
