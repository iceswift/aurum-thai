apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurum-pushgateway
spec:
  selector:
    matchLabels: {app: aurum-pushgateway}
  template:
    metadata:
      labels: {app: aurum-pushgateway}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.1
          ports:
            - containerPort: 9091
---
apiVersion: v1
kind: Service
metadata:
  name: aurum-pushgateway
spec:
  selector: {app: aurum-pushgateway}
  ports:
    - {port: 9091, targetPort: 9091}
