apiVersion: v1
kind: Namespace
metadata:
  name: aurum-staging
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aurum-data
  namespace: aurum-staging
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurum-api
  namespace: aurum-staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aurum-api
  template:
    metadata:
      labels:
        app: aurum-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: aurum-thai:staging
          imagePullPolicy: Never
          env:
            - name: NOTIFICATION_STATE_FILE
              value: /app/data/notification_state.json
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aurum-data
---
apiVersion: v1
kind: Service
metadata:
  name: aurum-api
  namespace: aurum-staging
spec:
  selector:
    app: aurum-api
  ports:
    - port: 8000
      targetPort: http
