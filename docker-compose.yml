services:
  gold-api:
    build:
      context: .
    image: aurum-thai:latest
    container_name: gold-api
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ../data:/app/data
      - ../secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
